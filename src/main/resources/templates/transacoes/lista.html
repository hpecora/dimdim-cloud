<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Transações</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Transações</h1>

    <a href="/" class="voltar">← Início</a>

    <a href="/transacoes/nova" class="botao">
        Nova transação
    </a>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data</th>
            <th>Tipo</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="transacao : ${transacoes}">

            <td th:text="${transacao.id}"></td>

            <td th:text="${transacao.descricao}"></td>

            <td th:text="${transacao.valor}"></td>

            <td th:text="${transacao.data}"></td>

            <td th:text="${transacao.tipo}"></td>

            <td th:text="${transacao.categoria.nome}"></td>

            <td>

                <a th:href="@{/transacoes/editar/{id}(id=${transacao.id})}">
                    Editar
                </a>

                |

                <a th:href="@{/transacoes/excluir/{id}(id=${transacao.id})}">
                    Excluir
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
